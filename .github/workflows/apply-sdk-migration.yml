name: Apply PLAIK SDK migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sdk-migrated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify migration bundle
        shell: bash
        run: |
          cat .migration/sdk/*.part > /tmp/sdk_bundle.py
          echo '30c5c721c9730198fd711709b105feac7b8b3cd334ed68fc5d8a3138a14cea0a  /tmp/sdk_bundle.py' | sha256sum -c -
      - name: Apply complete SDK snapshot
        shell: bash
        run: |
          rm -rf src/plaik_contracts src/plaik_sdk
          python /tmp/sdk_bundle.py
          python -m compileall -q src
      - name: Commit migrated SDK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .migration/sdk .github/workflows/apply-sdk-migration.yml
          rmdir .migration 2>/dev/null || true
          git add src
          git commit -m 'Complete PLAIK SDK migration [sdk-migrated]'
          git push origin HEAD:main
